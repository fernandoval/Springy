name: Tests

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    name: php-${{ matrix.php-version }}-mysql-${{ matrix.mysql-version }}

    env:
      extensions: curl, gmp, json, libxml, mbstring, memcached, pdo, pdo_mysql, redis, zip
      key: cache-v2

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version: ['8.2', '8.3', '8.4', '8.5']
        mysql-version:
          - '8.0'

    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: springy
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: --health-cmd="valkey-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup cache environment
        id: cache-env
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.extensions }}
          key: ${{ env.key }}

      - name: Cache extensions
        uses: actions/cache@v4
        with:
          path: ${{ steps.cache-env.outputs.dir }}
          key: ${{ steps.cache-env.outputs.key }}
          restore-keys: ${{ steps.cache-env.outputs.key }}

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.extensions }}
          ini-values: date.timezone='UTC'
          coverage: none

      - name: Determine composer cache directory
        if: matrix.os == 'ubuntu-latest'
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache dependencies installed with composer
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php-${{ matrix.php-version }}-mysql-${{ matrix.mysql-version }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php-${{ matrix.php-version }}-composer-${{ matrix.mysql-version }}-

      - name: Validate composer.json and composer.lock
        run: composer validate

      # - name: Cache Composer packages
      #   id: composer-cache
      #   uses: actions/cache@v3
      #   with:
      #     path: vendor
      #     key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
      #     restore-keys: |
      #       ${{ runner.os }}-php-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Run test suite
        env:
          DB_HOST: "127.0.0.1"
          DB_NAME: springy
          DB_USER: root
          DB_PASS: root
          MYSQL: ${{ matrix.mysql-version }}
          REDIS_HOST: "127.0.0.1"
          REDIS_PORT: 6379
          MEMCACHED_HOST: "127.0.0.1"
          MEMCACHED_PORT: 11211
        run: composer run test